[meta]
type = sim
name = network

[experiment]
algorithms = woot, logoot, rga, lseq, treedoc
patterns = mixed
replicas = 5
ops_per_replica = 500
initial_doc_size = 1000
scenarios = lan, default, wan, high_jitter, fifo_wan, lossy_5, lossy_20
op_interval_ms = 50
repetitions = 1
seed = 20261014

[scenario.lan]
latency_ms = 1
jitter_ms = 0.5
reorder = true

[scenario.default]
latency_ms = 20
jitter_ms = 10
reorder = true

[scenario.wan]
latency_ms = 150
jitter_ms = 50
reorder = true

[scenario.high_jitter]
latency_ms = 20
jitter_ms = 300
reorder = true

[scenario.fifo_wan]
latency_ms = 150
jitter_ms = 50
reorder = false

[scenario.lossy_5]
latency_ms = 20
jitter_ms = 10
loss_rate = 0.05
retransmit = true

[scenario.lossy_20]
latency_ms = 20
jitter_ms = 10
loss_rate = 0.20
retransmit = true

[crdt]
seed = 2026
