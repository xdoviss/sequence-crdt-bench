# Synchronization intervals / message batching
[meta]
type = sim
name = sync_intervals

[experiment]
algorithms = woot, logoot, rga, lseq, treedoc
patterns = mixed
replicas = 10
ops_per_replica = 2000
initial_doc_size = 10000
scenarios = interval_0, interval_50, interval_200, interval_1000, interval_5000
op_interval_ms = 50
repetitions = 3
seed = 20261014

[scenario.interval_0]
latency_ms = 20
jitter_ms = 10
sync_interval_ms = 0

[scenario.interval_50]
latency_ms = 20
jitter_ms = 10
sync_interval_ms = 50
max_batch_ops = 256

[scenario.interval_200]
latency_ms = 20
jitter_ms = 10
sync_interval_ms = 200
max_batch_ops = 256

[scenario.interval_1000]
latency_ms = 20
jitter_ms = 10
sync_interval_ms = 1000
max_batch_ops = 256

[scenario.interval_5000]
latency_ms = 20
jitter_ms = 10
sync_interval_ms = 5000
max_batch_ops = 256

[crdt]
seed = 2026
