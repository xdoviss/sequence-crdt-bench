# memory consumption and data-structure growth
[meta]
type = memory
name = memory

[memory]
algorithms = woot, logoot, rga, lseq, treedoc
doc_sizes = 1000, 10000, 100000, 1000000
growth_patterns = random_insert, sequential_typing, end_insert, front_insert, uniform_mixed, deletion_heavy
growth_ops = 100000
growth_checkpoints = 20
memory_budget_mb = 2048 # ... or if the CRDT heap exceeds this
time_budget_s = 600 # a growth run is truncated (and marked) if it exceeds this
cycle_doc_size = 10000
cycles = 20
cycle_ops = 1000
deletion_doc_size = 100000
delete_fractions = 0.25, 0.5, 0.75, 0.9, 1.0
seed = 20261014

[crdt]
seed = 2026
