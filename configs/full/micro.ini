# latency of individual operations vs document size
[meta]
type = micro
name = micro

[micro]
algorithms = woot, logoot, rga, lseq, treedoc
doc_sizes = 1000, 10000, 100000, 1000000
repetitions = 10 # fresh copy of the initial state per rep
ops_per_repetition = 1000  # measured inserts and deletes per repetition
warmup_ops = 500 # executed before measuring, excluded from results
batch_ops = 25 # operations timed together, the result is time per operation
lookup_samples = 50000
traversal_repetitions = 20
serialization_repetitions = 10
seed = 20261014

[crdt]
seed = 2026
logoot_boundary = 65536
lseq_base_bits = 4
lseq_boundary = 10
treedoc_gc = true
