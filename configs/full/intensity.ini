# throughput vs workload intensity and concurrent editing bursts
[meta]
type = sim
name = intensity

[experiment]
algorithms = woot, logoot, rga, lseq, treedoc
patterns = hotspot
replicas = 10
ops_per_replica = 2000
initial_doc_size = 10000
scenarios = default
op_interval_ms = 500, 100, 20, 5, 1 # offered load = replicas * 1000 / interval ops/s
burst_size = 1, 20
repetitions = 3
seed = 20261014

[scenario.default] # reliable eventual delivery, delays and reordering enabled
latency_ms = 20
jitter_ms = 10
jitter = exponential
reorder = true
loss_rate = 0
retransmit = true
sync_interval_ms = 0
max_batch_ops = 64

[crdt]
seed = 2026
