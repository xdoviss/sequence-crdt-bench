# number of concurrent users (synchronization time vs replica count)
[meta]
type = sim
name = scale_replicas

[experiment]
algorithms = woot, logoot, rga, lseq, treedoc
patterns = mixed, hotspot
replicas = 2, 5, 10, 20, 50
ops_per_replica = 1000
initial_doc_size = 10000
scenarios = default
op_interval_ms = 50
repetitions = 3
seed = 20261014

[scenario.default] # reliable eventual delivery, delays and reordering enabled
latency_ms = 20
jitter_ms = 10
jitter = exponential
reorder = true
loss_rate = 0
retransmit = true
sync_interval_ms = 0
max_batch_ops = 64

[crdt]
seed = 2026
